# Dependabot version updates.
#
# Every ecosystem is checked weekly. Minor and patch bumps are grouped into one
# PR per ecosystem and directory; major bumps open individually so they can be
# reviewed (and reverted) on their own.
#
# Commit messages follow Conventional Commits, and the type decides whether
# release-please cuts a release for the merge (docs/governance/RELEASING.md,
# "Dependency updates"): "fix(deps): …" for runtime dependencies of what ships
# (backend, frontend, admin MCP, their images and the deploy compose images),
# so they lead to a patch release; "chore(deps-dev): …" for development
# dependencies; "ci(deps): …" for GitHub Actions; and "chore(deps): …" for
# internal tooling. The labels below must exist in the repository.
#
# Dependabot alerts, security updates, secret scanning and push protection are
# repository settings, not part of this file. Enable them under
# Settings > Code security.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # gorm 1.31 resolves a foreignKey tag through the namer, so every
      # `Business Business gorm:"foreignKey:BusinessID"` field binds to
      # Business.BusinessId and turns into a has-one. Projected Business
      # loads come back empty and guest QR lookups 404. Hold the 1.30 line
      # (and the postgres driver that still accepts it) until that is fixed.
      - dependency-name: gorm.io/gorm
        versions: [">= 1.31.0"]
      - dependency-name: gorm.io/driver/postgres
        versions: [">= 1.6.2"]
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # Tailwind 4 is a manual migration (new config format and PostCSS
      # plugin), and tailwind-scrollbar 4 needs Tailwind 4, so both majors
      # must move together in one hand-made PR. Either bump alone fails
      # npm ci.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwind-scrollbar
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tools/payverge-admin-mcp
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      admin-mcp-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # backend/Dockerfile, and backend/scripts/backup.Dockerfile (PostgreSQL,
  # the same digest as deploy/docker-compose.yml).
  - package-ecosystem: docker
    directories:
      - /backend
      - /backend/scripts
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # A PostgreSQL major moves the data directory (upgrade-postgres.sh) and
      # the genesis PostgresMajor check refuses it: that is a MAJOR release
      # done by hand (docs/governance/RELEASING.md, "Dependency updates"),
      # never a fix(deps) patch.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      backend-images-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: wednesday
      time: "06:30"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: fix
      include: scope
    groups:
      frontend-images-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Third-party images of the self-host stack (Postgres, Caddy, rclone), pinned
  # by tag and digest in deploy/docker-compose.yml and in the Coolify template
  # (deploy/platforms/coolify, same Postgres digest), and of the source-build
  # compose files at the root (Postgres, Go). Directories do not recurse, so
  # each is listed. One group spans them all, so a Postgres bump lands
  # everywhere in one pull request.
  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /
      - /deploy/platforms/coolify
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # A PostgreSQL major moves the data directory (upgrade-postgres.sh) and
      # the genesis PostgresMajor check refuses it: that is a MAJOR release
      # done by hand (docs/governance/RELEASING.md, "Dependency updates"),
      # never a fix(deps) patch.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      caddy-images-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tools/screenshot-extension
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      screenshot-extension-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /scripts/ci/workflowcontract
    schedule:
      interval: weekly
      day: thursday
      time: "06:30"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore
      include: scope
    groups:
      workflowcontract-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /tools/route-coverage
    schedule:
      interval: weekly
      day: thursday
      time: "07:00"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore
      include: scope
    groups:
      route-coverage-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
