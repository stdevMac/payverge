# Releases: release-please, then multi-arch images and release assets.
#
# Every push to main runs release-please (configuration in
# .github/release-please-config.json and .github/.release-please-manifest.json).
# It keeps a release pull request up to date; merging that pull request creates
# the vX.Y.Z tag and GitHub release, and the jobs below then publish:
#
#   ghcr.io/stdevmac/payverge-backend   linux/amd64 + linux/arm64
#   ghcr.io/stdevmac/payverge-frontend  linux/amd64 + linux/arm64
#     tags X.Y.Z, vX.Y.Z, X.Y and X (X only from 1.0.0 on); latest for
#     stable releases only. Prereleases get X.Y.Z-pre and vX.Y.Z-pre only.
#     SLSA provenance (mode=max) and an SBOM attestation per platform,
#     and a keyless cosign signature on the multi-arch index.
#   release assets: deploy/ files, a deploy tarball, THIRD_PARTY_LICENSES.md
#     and SHA256SUMS (scripts/ci/release-assets.sh), plus
#     SHA256SUMS.sigstore.json, a keyless cosign bundle for SHA256SUMS that
#     deploy/install.sh verifies when cosign is installed.
#
# Nothing is built until ci.yml has passed on the release commit (job
# ci-verdict, scripts/ci/wait-for-ci.sh): a release pull request merged while
# CI was red or still running, or a dispatched tag on an untested commit,
# publishes nothing. Make CI green on that commit, then dispatch this
# workflow with the tag.
#
# ci-verdict also runs scripts/check-hardcoded-domain.sh --release, which
# fails while KNOWN_DEBT files in that script still name the upstream domain.
# That check runs after release-please has tagged, so ci.yml runs the same
# --release check on the release-please pull request (contracts job, part of
# ci-ok): keep ci-ok a required check so the release PR cannot merge while
# KNOWN_DEBT is non-empty. That PR check only runs if ci.yml runs on the
# release PR: set the RELEASE_PLEASE_TOKEN secret in the `release`
# environment (see the release-please step), or close and reopen the release PR, because a PR opened with
# GITHUB_TOKEN triggers no workflows. If a tag exists without images anyway,
# clean the debt, then dispatch this workflow with the tag.
#
# release-please skips its job on workflow_dispatch, and GitHub skips every
# job downstream of a skipped job unless the job has its own status check, so
# each job after resolve runs on `!cancelled()` plus the result of every job
# it needs.
#
# Each platform builds natively (ubuntu-24.04 and ubuntu-24.04-arm), never
# under QEMU, and the per-platform digests are merged into one index.
#
# Published images use the default backend build only. The opt-in `whatsapp`
# build tag links GPL-3.0 code, so no job here passes build tags, and the
# backend build fails if the binary it pushed links go.mau.fi.
#
# workflow_dispatch with an existing tag re-runs the publish jobs for that tag:
# the first release (v1.0.0 is tagged by hand) and recovery from a failed run.
#
# Only main may publish. resolve fails unless the run is on refs/heads/main
# (a dispatch from any other branch runs that branch's copy of this file) and
# the tagged commit is an ancestor of main (git merge-base --is-ancestor), so
# a tag pushed on a side branch never ships. build, publish and assets also
# re-check github.ref. release-please, publish and assets run in the
# `release` environment: restrict its deployment branches to main (Settings >
# Environments > release) so no other ref can reach RELEASE_PLEASE_TOKEN, the
# signing identity or release write access. The cosign certificate identity is therefore exactly
#   https://github.com/stdevMac/payverge/.github/workflows/release.yml@refs/heads/main
#
# The images carry no deployment-specific settings. The frontend gets only
# build metadata (NEXT_PUBLIC_RELEASE_SHA, NEXT_PUBLIC_VERSION,
# NEXT_PUBLIC_BUILD_TIMESTAMP, NEXT_PUBLIC_SENTRY_RELEASE) from
# scripts/ci/image-build-args.sh; URLs, network and support address are read
# from the container environment at request time
# (docs/self-hosting/frontend-config.md), and deploy/ shows how an instance
# sets them. ci.yml builds both images with the same arguments on every pull
# request, so a frontend that only builds with deployment URLs fails there
# first, not here. release-assets.sh refuses to run until every deploy/ file
# it ships is tracked.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish images and assets for (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Never cancel a release half-way through publishing.
  group: release-${{ github.ref }}-${{ inputs.tag || 'push' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/stdevmac/payverge

jobs:
  release-please:
    name: release-please
    # Forks have no use for release pull requests.
    if: github.event_name == 'push' && github.repository == 'stdevMac/payverge'
    # RELEASE_PLEASE_TOKEN is an environment secret; the environment's
    # deployment branches are restricted to main in the repository settings.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # release commits, tags and GitHub releases
      pull-requests: write # open and update the release pull request
      issues: write # create the "autorelease: pending" labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with GITHUB_TOKEN do not trigger workflows, so
          # the release PR would get no CI. An optional fine-grained token
          # (contents + pull requests: write on this repository) fixes that;
          # without it, close and reopen the release PR to start CI. It is a
          # secret of the `release` environment, so only main can read it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  resolve:
    name: Resolve release tag
    needs: release-please
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      # Full history: the ancestry check below needs main and the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          DISPATCH_TAG: ${{ inputs.tag }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$RUN_REF" != refs/heads/main ]]; then
            echo "::error::Releases run only from main; this run is on $RUN_REF. Dispatch the workflow from main."
            exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$CREATED_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag of the form vX.Y.Z or vX.Y.Z-pre."
            exit 1
          fi
          # Every later job builds this exact commit, even if the tag moves.
          if ! sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" || [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Tag $tag does not exist in $GH_REPO."
            exit 1
          fi
          # A tag on a commit main never contained publishes nothing.
          if ! git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then
            echo "::error::Tag $tag ($sha) is not reachable from main ($GITHUB_SHA)."
            exit 1
          fi
          version="${tag#v}"
          stable=true
          if [[ "$version" == *-* ]]; then stable=false; fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "version=$version"
            echo "stable=$stable"
          } >>"$GITHUB_OUTPUT"
          echo "Publishing $tag at $sha (stable: $stable)"

  ci-verdict:
    name: CI passed on the release commit
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-24.04
    # ci.yml runs in parallel with this workflow on the merge to main; its
    # slowest lane may take an hour of its own after queueing.
    timeout-minutes: 120
    permissions:
      actions: read # list the ci.yml runs for the release commit
      contents: read
    steps:
      # The release commit, not main's head: the domain check below must judge
      # what is being released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            backend
            frontend/src
      # PR CI tolerates the KNOWN_DEBT files in check-hardcoded-domain.sh
      # (warned on); a release must not ship upstream-domain links,
      # mailboxes or redirects, so --release fails while any remain.
      - name: No upstream domain in the release (known debt included)
        run: ./scripts/check-hardcoded-domain.sh --release
      - name: Wait for a green CI run on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: bash scripts/ci/wait-for-ci.sh "$SHA"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [resolve, ci-verdict]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.resolve.result == 'success' && needs.ci-verdict.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push per-platform images by digest to GHCR
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Build arguments
        id: args
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # Build metadata only, from the script ci.yml's `images` and
          # `frontend-build` jobs also use, so CI builds what a release builds.
          # A published image must not carry one deployment's URLs.
          args="$(bash scripts/ci/image-build-args.sh "$IMAGE" "$VERSION")"
          {
            echo "build-args<<BUILD_ARGS_EOF"
            if [[ -n "$args" ]]; then echo "$args"; fi
            echo "BUILD_ARGS_EOF"
          } >>"$GITHUB_OUTPUT"
          echo "source-date-epoch=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=payverge-${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.licenses=Apache-2.0 AND LGPL-3.0-or-later

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.args.outputs.source-date-epoch }}
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # No registry or GHA cache: a release builds from scratch.
          no-cache: true
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.image == 'backend'
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Pushed backend binary links no GPL code
        if: matrix.image == 'backend'
        env:
          REF: ${{ env.IMAGE_PREFIX }}-backend@${{ steps.build.outputs.digest }}
        run: |
          docker pull --quiet "$REF"
          cid="$(docker create "$REF")"
          docker cp "$cid:/app/server" "$RUNNER_TEMP/server"
          docker rm "$cid" >/dev/null
          go version -m "$RUNNER_TEMP/server" >"$RUNNER_TEMP/buildinfo.txt"
          if grep -E '(dep|=>)[[:space:]]+go\.mau\.fi/|-tags=.*whatsapp' "$RUNNER_TEMP/buildinfo.txt"; then
            echo "::error::The backend image links go.mau.fi (whatsapp build tag). It must never be published."
            exit 1
          fi
          grep -E '^[[:space:]]+(path|build)[[:space:]]' "$RUNNER_TEMP/buildinfo.txt"

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish and sign ${{ matrix.image }}
    needs: [resolve, build]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.resolve.result == 'success' && needs.build.result == 'success' }}
    # Deployment branches restricted to main in the repository settings.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # tag the multi-arch index and push its signature
      id-token: write # keyless cosign signing with the workflow's OIDC identity
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Index-level annotations link the multi-arch package to the repository.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          flavor: latest=false
          # For a prerelease, metadata-action turns every semver pattern
          # except {{raw}} into {{version}}, so the v-prefixed tag is the
          # resolved git tag itself (raw): vX.Y.Z and vX.Y.Z-pre alike.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=raw,value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.tag }},enable=${{ !startsWith(needs.resolve.outputs.tag, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=payverge-${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.licenses=Apache-2.0 AND LGPL-3.0-or-later

      - name: Create the multi-arch index
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          META_JSON: ${{ steps.meta.outputs.json }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | ("--tag", .)' <<<"$META_JSON")
          mapfile -t annotations < <(jq -r '.annotations[] | ("--annotation", .)' <<<"$META_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          if [[ ${#sources[@]} -ne 2 ]]; then
            echo "::error::Expected one digest per platform (2), found ${#sources[@]}."
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${annotations[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Sign the index (keyless)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          {
            echo "### $IMAGE@$DIGEST"
            echo
            echo '```sh'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/stdevMac/payverge/.github/workflows/release.yml@refs/heads/main"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "signed by $WORKFLOW_REF"

  assets:
    name: Release assets
    # Only after both images are published, so a release's install files
    # never point at missing images.
    needs: [resolve, publish]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.resolve.result == 'success' && needs.publish.result == 'success' }}
    # Deployment branches restricted to main in the repository settings.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # upload files to (or draft) the GitHub release
      id-token: write # keyless cosign signature on SHA256SUMS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install frontend dependencies (licence report)
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Stage assets
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash scripts/ci/release-assets.sh "$VERSION" "$RUNNER_TEMP/release-assets"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # SHA256SUMS covers every other asset, so one signature covers the
      # release. deploy/install.sh checks the bundle against this identity.
      - name: Sign SHA256SUMS (keyless)
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/stdevMac/payverge/.github/workflows/release.yml@refs/heads/main \
            SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          # A hand-made tag (the first release, v1.0.0) has no GitHub release
          # yet: create a draft for the maintainer to review and publish.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes "See docs/CHANGELOG.md for the changes in $TAG."
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/release-assets/* --clobber
