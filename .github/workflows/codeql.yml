# CodeQL advanced setup for Go and JavaScript/TypeScript.
#
# Repository settings must leave CodeQL "default setup" off: GitHub rejects
# uploads from an advanced-setup workflow while default setup is enabled.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly sweep so new queries run against unchanged code.
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # go.mod lives under backend/, so the Go database is built from an
          # explicit build of that tree.
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go for CodeQL
        if: matrix.build-mode == 'manual'
        working-directory: backend
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
