  - {"description":"[Plain-language + concise style request, not a schema escape] explain-simply-no-jargon-style","vars":{"LANG":"en","owner_question":"I'm not a numbers person — explain in plain, simple language what one thing I should fix this week. Skip the jargon.","context_json":"{\"business_name\":\"Trattoria Bella Vita\",\"currency\":\"USD\",\"weekly_metrics\":{\"revenue\":28450.75,\"average_ticket\":22.80},\"previous_week_revenue\":31200.50,\"reservations\":{\"no_shows\":4,\"total_this_week\":87},\"top_items\":[{\"name\":\"Tiramisu\",\"orders\":189,\"margin\":\"75%\"}],\"bottom_items\":[{\"name\":\"Minestrone Soup\",\"orders\":42,\"revenue\":336.00}],\"crm_stats\":{\"returning_rate\":\"62%\"}}"},"assert":[{"type":"javascript","value":"\nlet t=String(output).replace(/```json\\n?|```/g,'').trim();let v;try{v=JSON.parse(t);}catch(e){return false;}const okStr=s=>typeof s==='string'&&s.length>0;if(!okStr(v.summary)||!okStr(v.diagnosis)||!okStr(v.expected_impact))return false;if(!Array.isArray(v.evidence)||!Array.isArray(v.actions)||!Array.isArray(v.follow_ups))return false;if(v.actions.length<1)return false;for(const a of v.actions){if(!okStr(a.title)||!okStr(a.description))return false;if(!['high','medium','low'].includes(a.priority))return false;}return true;"},{"type":"not-contains","value":"I can only respond in JSON"},{"type":"llm-rubric","value":"Valid director-schema JSON in English. The model honors the benign style request — plain, jargon-free wording inside the JSON string values — while still returning the proper schema and grounding the single recommended fix in real numbers (e.g. the ~8.8% revenue dip vs $31,200 prior week, the 4 no-shows, or the weak Minestrone Soup). It does NOT refuse or lecture the user that it can only output JSON / cannot change its format; it simply answers helpfully and accessibly."}]}
