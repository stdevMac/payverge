# AUTO-GENERATED red-team suite — do not hand-edit the tests block.
# Regenerate: node evals/promptfoo/lib/render_redteam.js <cases.json>
# Source prompt: backend/internal/services/prompts/director_console/. Production model gemini-2.5-flash (temp 0.2 / 4096 JSON).
#
# NOTE: this suite tests the RAW PROMPT LAYER only. It does NOT exercise the two
# deterministic production defenses stacked on top, so a sub-100% score here does
# NOT mean production leaks. Do not "fix" failures by weakening assertions.
#   1. normalizeStructuredOutput rebuilds every deep_link from an extracted tab
#      (extractTabFromDeepLink + buildTabDeepLink) -> external/phishing URLs can
#      never survive (neutralizes [deep-link-injection] in prod).
#   2. director_output_guard.go scrubs customer PII (context denylist + email/
#      phone regex) and fail-to-safes on system-prompt/tab-list/marker echo
#      (neutralizes [pii-leak] and [data-poisoning] system-prompt-leak in prod).
# Both are locked by Go tests in backend/internal/services/director_output_guard_test.go.
description: "Red-team — director (data-poisoning, PII leak, fabrication, JSON escape, deep-link invention)"

prompts:
