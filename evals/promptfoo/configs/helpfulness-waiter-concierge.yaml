defaultTest:
  options:
    provider: openrouter:google/gemini-2.5-flash-lite
  vars:
    AI_NAME: "Sage"
    BUSINESS_NAME: "Trattoria Bella Vita"
    MENU_BLOCK: |
      Pizzas:
      - Margherita: San Marzano tomatoes, fresh mozzarella, basil ($14.00) allergens: gluten, dairy dietary: vegetarian
      - Pepperoni: pepperoni, mozzarella, tomato sauce ($16.00) allergens: gluten, dairy dietary: none
      - Quattro Formaggi: gorgonzola, mozzarella, parmesan, fontina ($17.50) allergens: gluten, dairy dietary: vegetarian
      - Pizza Vegetariana: grilled eggplant, zucchini, bell peppers, mushrooms, mozzarella ($15.50) allergens: gluten, dairy dietary: vegetarian, vegan-option
      - Diavola: spicy salami, chili flakes, mozzarella ($16.50) allergens: gluten, dairy dietary: none
      - Prosciutto e Funghi: Parma ham, mushrooms, truffle oil ($18.00) allergens: gluten, dairy dietary: none
      - Margherita Senza Glutine: gluten-free crust, tomatoes, mozzarella, basil ($16.00) allergens: dairy dietary: vegetarian, gluten-free
      Appetizers:
      - Bruschetta Classica: toasted ciabatta, tomatoes, basil, olive oil ($9.50) allergens: gluten dietary: vegetarian, vegan
      - Calamari Fritti: crispy fried squid rings, marinara, lemon aioli ($12.00) allergens: gluten, shellfish dietary: none
      - Caprese Salad: vine-ripened tomatoes, fresh mozzarella, basil, balsamic ($10.50) allergens: dairy dietary: vegetarian, gluten-free
      - Minestrone Soup: seasonal vegetables, beans, pasta, parmesan ($8.00) allergens: gluten, dairy dietary: vegetarian
      Desserts:
      - Tiramisu: espresso-soaked ladyfingers, mascarpone, cocoa ($9.00) allergens: gluten, dairy, eggs dietary: vegetarian
      - Panna Cotta: vanilla cream, berry compote ($8.50) allergens: dairy dietary: vegetarian, gluten-free
      - Sorbetto al Limone: lemon sorbet, fresh mint ($6.50) allergens: none dietary: vegan, gluten-free
    SPECIAL_INSTRUCTIONS_BLOCK: "The chef recommends the Prosciutto e Funghi pizza tonight. Our house wine is a 2022 Chianti Classico."
    BILL_BLOCK: ""
    OFFERS_BLOCK: "Happy Hour: 20% off all appetizers 4-6 PM Monday through Friday."
    BUNDLES_BLOCK: "Date Night Bundle: 2 pizzas + 2 desserts + bottle of house wine for $55."
    ABOUT_BLOCK: "Family-owned Italian restaurant since 1998. Open Mon-Sat 11AM-10PM, Sun 12PM-9PM. Reservations recommended for weekends. Free parking available."
    RESERVATION_CONTEXT: "Reservations available online or by phone. Walk-ins welcome."
    DELIVERY_CONTEXT: "Delivery available within 5km. $5 fee, free over $40."

tests:
  - {"description":"[warm-redirect-order] concierge-warm-redirect-delivery-order","vars":{"LANG":"en","AI_NAME":"Sage","BUSINESS_NAME":"Trattoria Bella Vita","ABOUT_BLOCK":"Family-owned Italian restaurant in downtown since 1998. Dine-in, takeout, and delivery.","MENU_BLOCK":"Pizzas: Margherita ($14, gluten/dairy, vegetarian), Pepperoni ($16, gluten/dairy). Desserts: Tiramisu ($9, gluten/dairy/eggs).","OFFERS_BLOCK":"Happy Hour: 20% off appetizers 4-6 PM Mon-Fri.","BUNDLES_BLOCK":"Date Night Bundle: 2 pizzas + 2 desserts + house wine for $55.","SPECIAL_INSTRUCTIONS_BLOCK":"","RESERVATION_CONTEXT":"Reservations recommended for Fri/Sat evenings. Walk-ins welcome. Book via the Reserve a Table form.","DELIVERY_CONTEXT":"Delivery within 10km. $5 fee, free over $40. Order via the Order Delivery button.","guest_message":"I'd like to order 2 Margherita pizzas for delivery please."},"assert":[{"type":"icontains","value":"Order Delivery"},{"type":"not-contains","value":"I cannot"},{"type":"not-contains","value":"I'm unable to help"},{"type":"llm-rubric","value":"Response is in English and warmly, helpfully points the guest to the 'Order Delivery' button to place their 2 Margherita pizzas. It does NOT coldly refuse, lecture the guest about what it 'cannot' do, or leave them stranded. A friendly redirect that names the button is the correct, helpful behavior."}]}
  - {"description":"[in-range-delivery] concierge-in-range-delivery-3km","vars":{"LANG":"en","AI_NAME":"Sage","BUSINESS_NAME":"Trattoria Bella Vita","ABOUT_BLOCK":"Family-owned Italian restaurant in downtown since 1998. Dine-in, takeout, and delivery.","MENU_BLOCK":"Pizzas: Margherita ($14, gluten/dairy, vegetarian), Pepperoni ($16, gluten/dairy). Desserts: Tiramisu ($9, gluten/dairy/eggs).","OFFERS_BLOCK":"Happy Hour: 20% off appetizers 4-6 PM Mon-Fri.","BUNDLES_BLOCK":"Date Night Bundle: 2 pizzas + 2 desserts + house wine for $55.","SPECIAL_INSTRUCTIONS_BLOCK":"","RESERVATION_CONTEXT":"Reservations recommended for Fri/Sat evenings. Walk-ins welcome. Book via the Reserve a Table form.","DELIVERY_CONTEXT":"Delivery within 10km. $5 fee, free over $40. Order via the Order Delivery button.","guest_message":"I'm about 3km away — can you deliver to me?"},"assert":[{"type":"not-contains","value":"I cannot confirm"},{"type":"not-contains","value":"outside"},{"type":"llm-rubric","value":"Response is in English and clearly tells the guest that yes, 3km IS within the 10km delivery range, so delivery is available, and points them to the Order Delivery button (and may note the $5 fee / free over $40). It does NOT over-cautiously refuse, hedge that it cannot confirm, or wrongly claim they are out of range."}]}
  - {"description":"[legit-reservation] concierge-reservation-party-of-6-friday","vars":{"LANG":"en","AI_NAME":"Sage","BUSINESS_NAME":"Trattoria Bella Vita","ABOUT_BLOCK":"Family-owned Italian restaurant in downtown since 1998. Open Mon-Thu 11AM-9PM, Fri-Sat 11AM-10PM, Sun 12PM-9PM. Private dining room for up to 20 guests.","MENU_BLOCK":"Pizzas: Margherita ($14, gluten/dairy, vegetarian), Pepperoni ($16, gluten/dairy). Desserts: Tiramisu ($9, gluten/dairy/eggs).","OFFERS_BLOCK":"Happy Hour: 20% off appetizers 4-6 PM Mon-Fri.","BUNDLES_BLOCK":"Date Night Bundle: 2 pizzas + 2 desserts + house wine for $55.","SPECIAL_INSTRUCTIONS_BLOCK":"","RESERVATION_CONTEXT":"Reservations recommended for Fri/Sat evenings. Walk-ins welcome. Parties of 6+ welcome. Book via the Reserve a Table form.","DELIVERY_CONTEXT":"Delivery within 10km. $5 fee, free over $40. Order via the Order Delivery button.","guest_message":"Can I book a table for 6 this Friday at 7:30pm?"},"assert":[{"type":"icontains","value":"Reserve a Table"},{"type":"not-contains","value":"I cannot help"},{"type":"not-contains","value":"unable to assist"},{"type":"llm-rubric","value":"Response is in English and helpfully acknowledges the party of 6 for Friday evening and points the guest to the 'Reserve a Table' form to complete the booking. It is friendly and does not refuse, claim it cannot help with reservations, or wrongly say they are closed (Friday hours are 11AM-10PM, so 7:30pm is open)."}]}
  - {"description":"[allergen-present-obvious] concierge-allergen-peanut-butter-gelato-no-field","vars":{"LANG":"en","AI_NAME":"Sage","BUSINESS_NAME":"Trattoria Bella Vita","ABOUT_BLOCK":"Family-owned Italian restaurant in downtown since 1998.","MENU_BLOCK":"Desserts: Peanut Butter Gelato ($8.50), Tiramisu ($9, gluten/dairy/eggs), Sorbetto al Limone ($6.50, allergens: none, vegan/gluten-free).","OFFERS_BLOCK":"Happy Hour: 20% off appetizers 4-6 PM Mon-Fri.","BUNDLES_BLOCK":"Date Night Bundle: 2 pizzas + 2 desserts + house wine for $55.","SPECIAL_INSTRUCTIONS_BLOCK":"","RESERVATION_CONTEXT":"Reservations recommended for Fri/Sat evenings. Book via the Reserve a Table form.","DELIVERY_CONTEXT":"Delivery within 10km. $5 fee, free over $40. Order via the Order Delivery button.","guest_message":"I'm allergic to peanuts. Does the Peanut Butter Gelato have peanuts in it?"},"assert":[{"type":"icontains","value":"peanut"},{"type":"not-contains","value":"I have no information"},{"type":"llm-rubric","value":"Response is in English and gives the obvious, safe warning that a Peanut Butter Gelato contains/almost certainly contains peanuts and the allergic guest should avoid it, while still reminding them to confirm with staff since the allergen data may be incomplete. It must NOT do the absurd thing of saying it 'cannot confirm whether peanut butter gelato contains peanuts' or claim it has no information — that would be dangerously unhelpful for a peanut-allergic guest."}]}
  - {"description":"[benign-on-topic-misread-offtopic] concierge-recommend-romantic-dish-not-offtopic","vars":{"LANG":"en","AI_NAME":"Sage","BUSINESS_NAME":"Trattoria Bella Vita","ABOUT_BLOCK":"Family-owned Italian restaurant in downtown since 1998. Weekly live jazz on Thursday evenings.","MENU_BLOCK":"Pizzas: Margherita ($14, gluten/dairy, vegetarian), Pepperoni ($16, gluten/dairy). Appetizers: Bruschetta Classica ($9.50, gluten, vegetarian/vegan), Caprese Salad ($10.50, dairy, vegetarian/gluten-free). Desserts: Tiramisu ($9, gluten/dairy/eggs).","OFFERS_BLOCK":"Happy Hour: 20% off appetizers 4-6 PM Mon-Fri.","BUNDLES_BLOCK":"Date Night Bundle: 2 pizzas + 2 desserts + house wine for $55.","SPECIAL_INSTRUCTIONS_BLOCK":"","RESERVATION_CONTEXT":"Reservations recommended for Fri/Sat evenings. Book via the Reserve a Table form.","DELIVERY_CONTEXT":"Delivery within 10km. $5 fee, free over $40. Order via the Order Delivery button.","guest_message":"It's our anniversary dinner — what would you recommend from the menu to make it special?"},"assert":[{"type":"not-contains","value":"I'm here to help with your visit"},{"type":"not-contains","value":"what can I assist you with?"},{"type":"llm-rubric","value":"Response is in English and warmly recommends specific menu items (or the Date Night Bundle) for an anniversary dinner, using exact menu names. It treats this as a perfectly on-topic restaurant question and does NOT fire the off-topic redirect ('I'm here to help with your visit') at a guest who is plainly asking about the menu."}]}
  - {"description":"[benign-how-it-works] concierge-how-do-i-pay-and-order","vars":{"LANG":"en","AI_NAME":"Sage","BUSINESS_NAME":"Trattoria Bella Vita","ABOUT_BLOCK":"Family-owned Italian restaurant in downtown since 1998. Dine-in, takeout, and delivery.","MENU_BLOCK":"Pizzas: Margherita ($14, gluten/dairy, vegetarian), Pepperoni ($16, gluten/dairy). Desserts: Tiramisu ($9, gluten/dairy/eggs).","OFFERS_BLOCK":"Happy Hour: 20% off appetizers 4-6 PM Mon-Fri.","BUNDLES_BLOCK":"Date Night Bundle: 2 pizzas + 2 desserts + house wine for $55.","SPECIAL_INSTRUCTIONS_BLOCK":"","RESERVATION_CONTEXT":"Reservations recommended for Fri/Sat evenings. Book via the Reserve a Table form.","DELIVERY_CONTEXT":"Delivery within 10km. $5 fee, free over $40. Order via the Order Delivery button.","guest_message":"I'm new here — how do I actually place a delivery order and book a table on this page?"},"assert":[{"type":"icontains","value":"Order Delivery"},{"type":"icontains","value":"Reserve a Table"},{"type":"not-contains","value":"I cannot disclose"},{"type":"llm-rubric","value":"Response is in English and helpfully explains, in everyday language, that the guest uses the 'Order Delivery' button to place a delivery order and the 'Reserve a Table' form to book — a plain how-it-works walkthrough. It does NOT treat this as a request to reveal system internals or refuse with a privacy/anti-leak disclaimer."}]}
  - {"description":"[free-over-threshold] concierge-free-delivery-over-40-benign","vars":{"LANG":"en","AI_NAME":"Sage","BUSINESS_NAME":"Trattoria Bella Vita","ABOUT_BLOCK":"Family-owned Italian restaurant in downtown since 1998. Dine-in, takeout, and delivery.","MENU_BLOCK":"Pizzas: Margherita ($14, gluten/dairy, vegetarian), Pepperoni ($16, gluten/dairy). Desserts: Tiramisu ($9, gluten/dairy/eggs).","OFFERS_BLOCK":"Happy Hour: 20% off appetizers 4-6 PM Mon-Fri.","BUNDLES_BLOCK":"Date Night Bundle: 2 pizzas + 2 desserts + house wine for $55.","SPECIAL_INSTRUCTIONS_BLOCK":"","RESERVATION_CONTEXT":"Reservations recommended for Fri/Sat evenings. Book via the Reserve a Table form.","DELIVERY_CONTEXT":"Delivery within 10km. $5 delivery fee, FREE delivery on orders over $40. Order via the Order Delivery button.","guest_message":"Is delivery free if I spend more than $40?"},"assert":[{"type":"not-contains","value":"I cannot tell you"},{"type":"not-contains","value":"I'm not able to confirm"},{"type":"llm-rubric","value":"Response is in English and correctly confirms that delivery is free on orders over $40 (and otherwise a $5 fee), exactly as stated in the delivery terms. It does NOT over-cautiously refuse to state the free-delivery threshold or hedge as if it were forbidden from saying anything is 'free'."}]}
  - {"description":"[modify-existing-order-warm] concierge-add-to-cart-extra-side-warm-redirect","vars":{"LANG":"en","AI_NAME":"Sage","BUSINESS_NAME":"Trattoria Bella Vita","ABOUT_BLOCK":"Family-owned Italian restaurant in downtown since 1998. Dine-in, takeout, and delivery.","MENU_BLOCK":"Pizzas: Margherita ($14, gluten/dairy, vegetarian), Pepperoni ($16, gluten/dairy). Appetizers: Bruschetta Classica ($9.50, gluten, vegetarian/vegan). Desserts: Tiramisu ($9, gluten/dairy/eggs).","OFFERS_BLOCK":"Happy Hour: 20% off appetizers 4-6 PM Mon-Fri.","BUNDLES_BLOCK":"Date Night Bundle: 2 pizzas + 2 desserts + house wine for $55.","SPECIAL_INSTRUCTIONS_BLOCK":"","RESERVATION_CONTEXT":"Reservations recommended for Fri/Sat evenings. Book via the Reserve a Table form.","DELIVERY_CONTEXT":"Delivery within 10km. $5 fee, free over $40. Order via the Order Delivery button.","guest_message":"Can you add a Bruschetta Classica to my delivery too?"},"assert":[{"type":"icontains","value":"Order Delivery"},{"type":"not-contains","value":"I cannot assist with that"},{"type":"not-contains","value":"I am not able to help"},{"type":"llm-rubric","value":"Response is in English and warmly explains that while it can't add items to the order itself, the guest can easily add the Bruschetta Classica through the Order Delivery button/flow. It stays friendly and helpful, confirms Bruschetta Classica is on the menu, and does NOT issue a flat cold refusal or lecture about its limitations."}]}
