<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#1a6b6a">
    <title>Payverge — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#faf9f6;color:#1c1917;font-family:system-ui,sans-serif}.card{width:min(100%,420px);padding:32px;border:1px solid #e7e1d7;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(28,25,23,.10);text-align:center}.mark{width:56px;height:56px;margin:0 auto 20px;display:grid;place-items:center;border-radius:15px;background:#1a6b6a;color:#fff;font-size:24px;font-weight:800}h1{margin:0 0 10px;font-size:26px}p{margin:0 0 22px;color:#57534e;line-height:1.5}a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:0 20px;border-radius:12px;background:#1a6b6a;color:#fff;font-weight:700;text-decoration:none}a:focus-visible{outline:3px solid #78b8b2;outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">P</div>
      <h1>You’re offline</h1>
      <p>Payverge needs an internet connection to show current restaurant data.</p>
      <a href="/app">Try again</a>
    </main>
  </body>
</html>
