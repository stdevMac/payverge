  # Issue 790d: a price question about a named item must state the price.
  - id: waiter-price-for-item-question-en
    surface: waiter
    locale: en
    input:
      message: "how much cost the harvest bowl"
    expect:
      code: grounded
      text_contains:
        - "Harvest Bowl"
        - "$14.00"
        - "available"
      effects:
        action_count: 0
        entity_count: 1
        source_count: 1
      zdr: true

  # Issue 790a: a dietary "best option" ask gets one pick with a why and a
  # cross-category companion, not a re-list of the same catalog.
  - id: waiter-vegetarian-pick-not-relist-en
    surface: waiter
    locale: en
    input:
      message: "what's the best option for vegetarian like me?"
    expect:
      code: dietary_pick
      text_contains:
        - "My pick"
        - "Harvest Bowl"
        - "Roasted vegetables and grains"
        - "Iced Tea"
      text_excludes:
        - "Here are some available options"
        - "Seasonal Soup"
      effects:
        action_count: 0
        entity_count: 2
      zdr: true

  # Issue 816: when items carry allergen chips, "anything gluten free?" must use
  # them (recommend the safe item, name the flagged one) instead of refusing.
  # The staff-confirmation notice still ships because allergen data may be
  # incomplete elsewhere on the menu.
  - id: waiter-gluten-free-uses-allergen-chips-en
    surface: waiter
    locale: en
    input:
      message: "anything gluten free?"
    expect:
      code: dietary_pick
      text_contains:
        - "Iced Tea"
        - "Harvest Bowl"
        - "Gluten"
        - "allergen-staff-confirmation"
        - "may be incomplete"
      text_excludes:
        - "I can't confirm the allergen details"
        # Adversarial B1: the avoid dish (Harvest Bowl) is text-only — it must
        # never ship as an entity/source, because the guest UI renders every
        # menu-item entity as a tap-to-add card. Only the safe pick (Iced Tea)
        # is an entity.
        - "menu_item:harvest-bowl"
      effects:
        action_count: 0
        entity_count: 1
      zdr: true

  # Issue 790b: "how long it takes?" gets a kitchen follow-through answer, not
  # the capability shrug. No prep-time setting exists, so the answer routes to
  # staff/Call waiter instead of fabricating minutes.
  - id: waiter-wait-time-followthrough-en
    surface: waiter
    locale: en
    input:
      message: "how long it takes?"
    expect:
      code: visit_facts
      text_contains:
        - "kitchen"
        - "Call waiter"
      text_excludes:
        - "I can help with questions about the menu and your visit."
      effects:
        action_count: 0
        entity_count: 0
      zdr: true
