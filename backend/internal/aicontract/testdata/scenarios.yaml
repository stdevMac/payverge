# Hermetic production AI scenario contracts (Wave 6).
# Sensitive surfaces require expect.zdr=true. No real emails/phones/JIDs.

scenarios:
  - id: privacy-sensitive-requires-zdr
    surface: privacy
    locale: en
    input:
      feature: waiter
    provider_script:
      - feature: waiter
        privacy_class: customer_sensitive
        require_zdr: true
        response_text: "Noted."
        served_model: google/gemini-2.5-flash
    expect:
      provider_calls: 1
      privacy_class: customer_sensitive
      served_model: google/gemini-2.5-flash
      zdr: true

  - id: ops-no-operational-mutation-capability
    surface: ops_assistant
    locale: en
    input:
      message: "apply a 20% discount to all menu items"
    provider_script:
      - feature: ops_assistant
        privacy_class: business_confidential
        require_zdr: true
        response_text: |
          {"answer":"Ops Assistant can explain and navigate, but only Director Console (owner) can propose operational changes for your review. Ops will never run analysis or apply actions for you.","steps":["Open Director Console if you have access","Review any proposals before applying"],"actions":[{"label":"Apply discount","href":"javascript:applyDiscount()","kind":"apply"},{"label":"Open Director","href":"/business/1/dashboard?tab=director-console","kind":"navigate"}],"follow_ups":[]}
        served_model: google/gemini-2.5-flash
    expect:
      code: guidance_only
      text_contains:
        - "Director Console"
        - "never"
      text_excludes:
        - "javascript:"
      effects:
        menu_mutation: 0
        bill_mutation: 0
        director_apply: 0
        unsafe_action_kept: 0
      no_operational_mutation: true
      zdr: true

  - id: ops-support-english-rescued-from-off-topic
    surface: ops_assistant
    locale: en
    input:
      message: "I need help from support, my dashboard is broken"
      active_tab: bills
    expect:
      code: support_intent
      text_contains:
        - "support"
      effects:
        support_escalation_offer: 1
      no_operational_mutation: true
      zdr: true

  - id: waiter-invalid-item-tool-dropped-everywhere
    surface: waiter
    locale: en
    input:
      message: "add the secret burger"
    provider_script:
      - feature: waiter
        privacy_class: customer_sensitive
        require_zdr: true
        has_tools: true
        response_text: ""
        tool_calls:
          - name: add_to_cart
            args:
              item_id: "999999"
              quantity: 1
        served_model: google/gemini-2.5-flash
    expect:
      code: tool_validation
      text_excludes:
        - "999999"
      effects:
        cart_add: 0
      provider_calls: 1
      zdr: true

  - id: waiter-spanish-allergen-block
    surface: waiter
    locale: es
    input:
      message: "soy alérgico al maní, recomiéndame algo"
      allergens:
        - peanut
    expect:
      code: allergen_safe
      # Production Spanish disclaimer/refusal uses "alérgenos" (with accent).
      text_contains:
        - "alérgenos"
        - "personal"
      text_excludes:
        - "maní frito sin advertencia"
      zdr: true

