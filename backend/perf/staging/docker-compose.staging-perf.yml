# Staging-perf stack. Near-clone of the self-host production compose stack with:
#   - Postgres tuned for perf testing (shared_buffers, work_mem, slow-query log).
#   - Backend exposed on 0.0.0.0:8080 so k6 can hit it externally.
#   - Perf-mode env vars (PPROF_TOKEN, DB_SLOW_QUERY_LOG, PERF_STUB_PROVIDERS).
#   - No frontend, no Caddy — k6 talks directly to the backend.
#
# Use with: docker compose --env-file .env -f docker-compose.staging-perf.yml up -d
# See README.md for the full bring-up flow.

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-payverge}
      POSTGRES_USER: ${DB_USER:-payverge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payverge_password}
    # Perf tuning. shared_buffers/work_mem/max_connections are sized for a
    # 4 vCPU / 8GB host. 100 connections leaves headroom while bounding memory;
    # the application pool is 25. log_min_duration_statement surfaces the same
    # slow queries that DB_SLOW_QUERY_LOG=true catches at the GORM layer.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=100
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-payverge} -d ${DB_NAME:-payverge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: "2.0"

  backend:
    image: ${PAYVERGE_IMAGE_PREFIX:-ghcr.io/stdevmac/payverge}-backend:${PAYVERGE_IMAGE_TAG:-perf-latest}
    pull_policy: always
    restart: always
    environment:
      - ENV=${ENV:-staging}
      - APP_ENV=${APP_ENV:-staging}
      - PORT=8080
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY required for staging-perf}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - METRICS_TOKENS=${METRICS_TOKENS:-}
      # Perf-mode toggles. PPROF_TOKEN gates /debug/pprof + the snapshot endpoint
      # (Task 3). DB_SLOW_QUERY_LOG=true enables the GORM slow-query logger
      # (Task 4). PERF_STUB_PROVIDERS is forward-looking — the backend does not
      # honor it yet; see README "Safety" section.
      - PPROF_TOKEN=${PPROF_TOKEN:?PPROF_TOKEN required for staging-perf}
      - DB_SLOW_QUERY_LOG=true
      - PERF_STUB_PROVIDERS=true
      # Capacity contract: production-like conservative ceilings. Load above
      # the per-IP budget requires distributed generators; never disable the
      # limiter merely to obtain a higher headline throughput number.
      - GLOBAL_RATE_LIMIT_REQUESTS_PER_MINUTE=1200
      - SSE_MAX_SUBSCRIBERS_PER_BUSINESS=200
      - SSE_MAX_SUBSCRIBERS_PER_IP=30
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ALLOWED_REDIRECT_DOMAINS=${ALLOWED_REDIRECT_DOMAINS:-}
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - FORCE_HSTS=${FORCE_HSTS:-false}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://app.posthog.com}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-staging}
      - SENTRY_ENABLED=${SENTRY_ENABLED:-false}
      - SENTRY_ENABLE_TRACING=${SENTRY_ENABLE_TRACING:-false}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # SEC-1: env, not argv — see the note in the repo-root docker-compose.yml.
      - DB_PASSWORD=${DB_PASSWORD:-payverge_password}
    # Bind to 0.0.0.0 so k6 (or any external load generator) can reach the
    # backend. Production binds 127.0.0.1; this is the deliberate delta.
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8080}:8080"
    networks:
      - server
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --db-host
      - ${DB_HOST:-postgres}
      - --db-port
      - ${DB_PORT:-5432}
      - --db-user
      - ${DB_USER:-payverge}
      - --db-name
      - ${DB_NAME:-payverge}
      - --db-sslmode
      - ${DB_SSLMODE:-disable}
    mem_limit: 2g
    cpus: "2.0"

volumes:
  backend_data:
    driver: local
  postgres_data:
    driver: local

networks:
  server:
    driver: bridge
