# Payverge development stack: builds the backend and frontend from this
# checkout and runs them in development mode.
#
#   cp .env.example .env
#   docker compose --env-file .env up -d --build
#
#   frontend  http://localhost:3000  (also serves /api/v1 and /media through
#                                     its same-origin proxy to the backend)
#   backend   http://localhost:8080  (the API, for curl and tests)
#
# Both ports bind 127.0.0.1 only. Nothing here needs a third-party account:
# email is written to the backend log, uploads stay in the backend_storage
# volume, and AI stays off until an LLM key is set.
#
# This file is for working on Payverge. To run Payverge for a restaurant use
# deploy/ instead (published images, Caddy with automatic HTTPS, backups):
# see deploy/README.md.
#
# Production-mode rehearsal (the CI end-to-end stack): set ENV=production or
# APP_ENV=production plus every value the production preflight requires, as
# .github/e2e/ci.env.fixture does.
name: payverge-dev

services:
  postgres:
    image: postgres:15.19-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-payverge}
      POSTGRES_USER: ${DB_USER:-payverge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payverge_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Postgres entrypoint chowns the data dir to the postgres user via gosu.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1500m

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Empty (the default) builds the GPL-free image. Setting GO_TAGS to
        # `whatsapp` in .env compiles in the optional WhatsApp channel, which
        # links GPL-3.0 code; see docs/self-hosting/whatsapp.md.
        - GO_TAGS=${GO_TAGS:-}
    # Development mode unless .env says otherwise. ENV=production or
    # APP_ENV=production switches on production mode (preflight, secure
    # cookies, strict CORS) without a --production flag.
    command:
      - --db-host
      - ${DB_HOST:-postgres}
      - --db-port
      - ${DB_PORT:-5432}
      - --db-user
      - ${DB_USER:-payverge}
      - --db-name
      - ${DB_NAME:-payverge}
      - --db-sslmode
      - ${DB_SSLMODE:-disable}
      - --aws-region
      - ${AWS_REGION:-us-east-1}
      - --s3-protected-base-url
      - ${S3_PROTECTED_BASE_URL:-}
    # SEC-1: secrets are passed as environment, never as argv. Command-line
    # arguments are world-readable from /proc/<pid>/cmdline and are echoed in
    # full by `docker inspect`. The backend resolves every setting
    # flag-first-then-env (cmd/app/main.go).
    environment:
      - ENV=${ENV:-development}
      - APP_ENV=${APP_ENV:-development}
      - PORT=8080

      # --- Core ---------------------------------------------------------------
      # PUBLIC_URL is the one origin people use: the frontend, which proxies
      # /api/v1 and /media to this service.
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - DB_PASSWORD=${DB_PASSWORD:-payverge_password}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-payverge_local_dev_jwt_secret_2026}
      # Plugin-config secret encryption at rest. Empty outside production = a
      # per-instance key generated under /app/data on first boot.
      - PLUGIN_SECRET_KEY=${PLUGIN_SECRET_KEY:-}
      # Maintenance commands (docker compose exec backend /app/server admin ...)
      # read the database location from these.
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-payverge}
      - DB_NAME=${DB_NAME:-payverge}
      - DB_SSLMODE=${DB_SSLMODE:-disable}

      # --- First admin, signups, demo data -----------------------------------
      # Created once on first boot with an email/password login; an existing
      # account is only promoted and its password is never overwritten.
      # Recover with `docker compose exec -T backend /app/server admin
      # reset-password --email ... --password-stdin`. See
      # docs/self-hosting/admin.md.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # invite (default; admin-minted invite code), open or closed.
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite}
      # DEMO_DATA=true seeds demo restaurants owned by ADMIN_EMAIL on boot.
      # ADMIN_DEMO_AUTOMATION_ENABLED=true is the hosted showroom mode.
      - DEMO_DATA=${DEMO_DATA:-false}
      - ADMIN_DEMO_AUTOMATION_ENABLED=${ADMIN_DEMO_AUTOMATION_ENABLED:-}
      # The venue served at "/" (custom URL or id); empty = auto.
      - PRIMARY_VENUE=${PRIMARY_VENUE:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}

      # --- Proxy trust, CORS, cookies ----------------------------------------
      # Gin trusts only the private compose network. TRUSTED_PLATFORM must stay
      # blank.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12,127.0.0.1}
      - TRUSTED_PLATFORM=${TRUSTED_PLATFORM:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ALLOWED_REDIRECT_DOMAINS=${ALLOWED_REDIRECT_DOMAINS:-}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - FORCE_HSTS=${FORCE_HSTS:-false}

      # --- Branding and contacts (backend/internal/config/instance.go) -------
      - PRODUCT_NAME=${PRODUCT_NAME:-}
      - COMPANY_NAME=${COMPANY_NAME:-}
      - COMPANY_ADDRESS=${COMPANY_ADDRESS:-}
      - LEGAL_ENTITY=${LEGAL_ENTITY:-}
      - LEGAL_TERMS_URL=${LEGAL_TERMS_URL:-}
      - LEGAL_PRIVACY_URL=${LEGAL_PRIVACY_URL:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      - SECURITY_EMAIL=${SECURITY_EMAIL:-}
      - LOGO_URL=${LOGO_URL:-}
      - BRAND_COLOR=${BRAND_COLOR:-}

      # --- Email (docs/self-hosting/email.md) --------------------------------
      # EMAIL_PROVIDER empty = resend/postmark when their key is set, else log:
      # emails are written to the backend log, never sent anywhere.
      # EMAIL_VERIFICATION=auto|required|off (auto = off with log, else required).
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-}
      - EMAIL_LOG_CONTENT=${EMAIL_LOG_CONTENT:-}
      - EMAIL_PROVIDER_LOG_ALLOW_PRODUCTION=${EMAIL_PROVIDER_LOG_ALLOW_PRODUCTION:-}
      - EMAIL_VERIFICATION=${EMAIL_VERIFICATION:-auto}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@example.com}
      - FROM_EMAIL_UPDATES=${FROM_EMAIL_UPDATES:-updates@example.com}
      # Reply-To on transactional mail; empty falls back to SUPPORT_EMAIL.
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TLS=${SMTP_TLS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      # Resend delivery-event authentication and declared DNS alignment.
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - EMAIL_ALLOWED_FROM_DOMAINS=${EMAIL_ALLOWED_FROM_DOMAINS:-}
      - EMAIL_SPF_DOMAIN=${EMAIL_SPF_DOMAIN:-}
      - EMAIL_DKIM_DOMAIN=${EMAIL_DKIM_DOMAIN:-}
      - EMAIL_RETURN_PATH_DOMAIN=${EMAIL_RETURN_PATH_DOMAIN:-}
      - EMAIL_DMARC_POLICY=${EMAIL_DMARC_POLICY:-}
      # Durable transactional email outbox. "false" is the emergency rollback
      # to the legacy in-process retry.
      - EMAIL_OUTBOX_ENABLED=${EMAIL_OUTBOX_ENABLED:-true}
      - EMAIL_OUTBOX_TTL_HOURS=${EMAIL_OUTBOX_TTL_HOURS:-24}
      - EMAIL_OUTBOX_RETENTION_DAYS=${EMAIL_OUTBOX_RETENTION_DAYS:-14}
      # Per-tenant outbound email budget (blank = code default).
      - EMAIL_TENANT_DAILY_CAP=${EMAIL_TENANT_DAILY_CAP:-}
      - EMAIL_TENANT_DEMO_DAILY_CAP=${EMAIL_TENANT_DEMO_DAILY_CAP:-}
      - EMAIL_TENANT_RECIPIENT_DAILY_CAP=${EMAIL_TENANT_RECIPIENT_DAILY_CAP:-}
      - EMAIL_TENANT_RECIPIENT_GLOBAL_DAILY_CAP=${EMAIL_TENANT_RECIPIENT_GLOBAL_DAILY_CAP:-}
      - EMAIL_TENANT_RECIPIENT_GLOBAL_ALL_DAILY_CAP=${EMAIL_TENANT_RECIPIENT_GLOBAL_ALL_DAILY_CAP:-}
      - EMAIL_TENANT_RESERVATION_DAILY_CAP=${EMAIL_TENANT_RESERVATION_DAILY_CAP:-}
      - EMAIL_TENANT_RESERVATION_RECIPIENT_DAILY_CAP=${EMAIL_TENANT_RESERVATION_RECIPIENT_DAILY_CAP:-}
      - EMAIL_TENANT_DEDUPE_MINUTES=${EMAIL_TENANT_DEDUPE_MINUTES:-}

      # --- Uploads (docs/self-hosting/storage.md) ----------------------------
      # "local" keeps uploads in the backend_storage volume; "s3" uses any
      # S3-compatible service (AWS, MinIO, R2, Garage).
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_DIR=${STORAGE_DIR:-/data/storage}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
      - S3_PROTECTED_BUCKET=${S3_PROTECTED_BUCKET:-}
      - S3_PROTECTED_ENDPOINT=${S3_PROTECTED_ENDPOINT:-}
      - AWS_PROTECTED_ACCESS_KEY=${AWS_PROTECTED_ACCESS_KEY:-}
      - AWS_PROTECTED_SECRET_KEY=${AWS_PROTECTED_SECRET_KEY:-}

      # --- AI (docs/self-hosting/ai.md) --------------------------------------
      # Any OpenAI-compatible endpoint (Ollama, vLLM, LiteLLM); empty = OpenRouter.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # model=in/out USD per 1M tokens; required to enforce AI budget caps on
      # models outside the built-in price table (hosted vendors fail closed).
      - OPENROUTER_PRICES=${OPENROUTER_PRICES:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL_CHAT=${OPENROUTER_MODEL_CHAT:-google/gemini-2.5-flash}
      - OPENROUTER_MODEL_MENU=${OPENROUTER_MODEL_MENU:-google/gemini-2.5-flash}
      - OPENROUTER_MODEL_IMAGE=${OPENROUTER_MODEL_IMAGE:-google/gemini-2.5-flash-image}
      - OPENROUTER_MODEL_DIRECTOR=${OPENROUTER_MODEL_DIRECTOR:-google/gemini-2.5-flash}
      - OPENROUTER_MODEL_GUARDRAIL=${OPENROUTER_MODEL_GUARDRAIL:-google/gemini-2.5-flash-lite}
      - OPENROUTER_CHAT_FALLBACKS=${OPENROUTER_CHAT_FALLBACKS:-}
      - OPENROUTER_MENU_FALLBACKS=${OPENROUTER_MENU_FALLBACKS:-}
      - OPENROUTER_IMAGE_FALLBACKS=${OPENROUTER_IMAGE_FALLBACKS:-}
      - OPENROUTER_DIRECTOR_FALLBACKS=${OPENROUTER_DIRECTOR_FALLBACKS:-}
      - OPENROUTER_GUARDRAIL_FALLBACKS=${OPENROUTER_GUARDRAIL_FALLBACKS:-}
      # Zero-data-retention routing (OpenRouter only). Empty = enforce in
      # production mode, audit otherwise.
      - OPENROUTER_ZDR_MODE=${OPENROUTER_ZDR_MODE:-}
      - OPENROUTER_ZDR_APPROVED_MODELS=${OPENROUTER_ZDR_APPROVED_MODELS:-}
      # Guardrail failure posture: empty = fail closed in production mode.
      - GUARDRAIL_STRICT=${GUARDRAIL_STRICT:-}
      # Ranking headers sent to OpenRouter only. Empty = PUBLIC_URL / PRODUCT_NAME.
      - OPENROUTER_APP_URL=${OPENROUTER_APP_URL:-}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-}
      # Daily USD spend caps (empty = built-in default) and guest/public AI
      # abuse ceilings per UTC day. In-memory, per replica.
      - AI_DAILY_BUDGET_USD=${AI_DAILY_BUDGET_USD:-}
      - AI_BUDGET_GLOBAL_USD_DAY=${AI_BUDGET_GLOBAL_USD_DAY:-}
      - AI_BUDGET_GUEST_POOL_USD_DAY=${AI_BUDGET_GUEST_POOL_USD_DAY:-}
      - AI_WAITER_DAILY_MESSAGE_BUDGET=${AI_WAITER_DAILY_MESSAGE_BUDGET:-}
      - AI_WAITER_DAILY_MESSAGES_PER_IP=${AI_WAITER_DAILY_MESSAGES_PER_IP:-}
      - AI_WAITER_DAILY_MESSAGES_PER_DEVICE=${AI_WAITER_DAILY_MESSAGES_PER_DEVICE:-}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}

      # --- Payments (configured per restaurant in the dashboard) -------------
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PLUGIN_WEBHOOK_SECRET=${STRIPE_PLUGIN_WEBHOOK_SECRET:-}
      - STRIPE_CONNECT_CLIENT_ID=${STRIPE_CONNECT_CLIENT_ID:-}
      - STRIPE_CONNECT_WEBHOOK_SECRET=${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      - PAYPAL_WEBHOOK_SECRET=${PAYPAL_WEBHOOK_SECRET:-}
      - MERCADOPAGO_CLIENT_ID=${MERCADOPAGO_CLIENT_ID:-}
      - MERCADOPAGO_CLIENT_SECRET=${MERCADOPAGO_CLIENT_SECRET:-}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - MERCADOPAGO_WEBHOOK_SECRET_PREVIOUS=${MERCADOPAGO_WEBHOOK_SECRET_PREVIOUS:-}
      - MAX_PAYMENT_AMOUNT_CENTS=${MAX_PAYMENT_AMOUNT_CENTS:-}

      # --- On-chain USDC ------------------------------------------------------
      - RPC_URL=${RPC_URL:-}
      - USDC_MIN_CONFIRMATIONS=${USDC_MIN_CONFIRMATIONS:-}
      - QUOTE_RATE_MAX_AGE_MINUTES=${QUOTE_RATE_MAX_AGE_MINUTES:-}
      - CRYPTO_REFUND_MAINNET_ENABLED=${CRYPTO_REFUND_MAINNET_ENABLED:-}

      # --- Sign-in (optional) -------------------------------------------------
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}

      # --- Telegram and WhatsApp (optional) ----------------------------------
      # The operator-notification worker runs iff TELEGRAM_TOKEN is set; the
      # webhook route also needs TELEGRAM_WEBHOOK_SECRET.
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_NOTIFICATION_WORKER_CONCURRENCY=${TELEGRAM_NOTIFICATION_WORKER_CONCURRENCY:-2}
      - TELEGRAM_NOTIFICATION_EVENTS=${TELEGRAM_NOTIFICATION_EVENTS:-}
      - TELEGRAM_CONNECTION_TOKEN_TTL_MINUTES=${TELEGRAM_CONNECTION_TOKEN_TTL_MINUTES:-15}
      # Support-escalation bot, separate from the operator-notification one.
      - TELEGRAM_ESCALATION_BOT_TOKEN=${TELEGRAM_ESCALATION_BOT_TOKEN:-}
      - TELEGRAM_ESCALATION_CHAT_ID=${TELEGRAM_ESCALATION_CHAT_ID:-}
      # Honoured only by a backend built with the `whatsapp` Go tag (GPL-3.0); the
      # default build ignores it and warns.
      - WHATSAPP_ENABLED=${WHATSAPP_ENABLED:-false}

      # --- Web push (optional) -----------------------------------------------
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}

      # --- Fiscal (AFIP/ARCA) worker: always on; only the sweep interval ----
      - FISCAL_WORKER_INTERVAL_SECONDS=${FISCAL_WORKER_INTERVAL_SECONDS:-10}

      # --- Observability (optional; nothing is sent when empty) -------------
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-dev}
      - SENTRY_ENABLED=${SENTRY_ENABLED:-}
      - SENTRY_ENABLE_LOGS=${SENTRY_ENABLE_LOGS:-false}
      - SENTRY_ENABLE_TRACING=${SENTRY_ENABLE_TRACING:-true}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      - SENTRY_LOG_LEVELS=${SENTRY_LOG_LEVELS:-error,fatal,panic}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://app.posthog.com}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - METRICS_TOKENS=${METRICS_TOKENS:-}

      # --- Admin MCP server (agentic configuration; docs/ai/) ---------------
      # Prefer the SHA-256 form. Empty = the admin MCP endpoints are disabled.
      - PAYVERGE_ADMIN_MCP_TOKEN_SHA256=${PAYVERGE_ADMIN_MCP_TOKEN_SHA256:-}
      - PAYVERGE_ADMIN_MCP_TOKEN=${PAYVERGE_ADMIN_MCP_TOKEN:-}
      - PAYVERGE_ADMIN_MCP_ALLOWED_IPS=${PAYVERGE_ADMIN_MCP_ALLOWED_IPS:-}

      # --- Rate limits (empty = built-in defaults) ---------------------------
      - GLOBAL_RATE_LIMIT_REQUESTS_PER_MINUTE=${GLOBAL_RATE_LIMIT_REQUESTS_PER_MINUTE:-}
      - AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE=${AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE:-}
      - AUTH_RATE_LIMIT_BURST=${AUTH_RATE_LIMIT_BURST:-}
      - REGISTRATION_RATE_LIMIT_PER_HOUR=${REGISTRATION_RATE_LIMIT_PER_HOUR:-}
      - STAFF_AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE=${STAFF_AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE:-}
      - STAFF_AUTH_RATE_LIMIT_BURST=${STAFF_AUTH_RATE_LIMIT_BURST:-}
      - PUBLIC_FORM_RATE_LIMIT_REQUESTS_PER_MINUTE=${PUBLIC_FORM_RATE_LIMIT_REQUESTS_PER_MINUTE:-}
      - PUBLIC_FORM_RATE_LIMIT_BURST=${PUBLIC_FORM_RATE_LIMIT_BURST:-}
      # /media has its own per-IP bucket (0 disables; docs/self-hosting/storage.md).
      - MEDIA_RATE_LIMIT_REQUESTS_PER_MINUTE=${MEDIA_RATE_LIMIT_REQUESTS_PER_MINUTE:-}
      - MEDIA_RATE_LIMIT_BURST=${MEDIA_RATE_LIMIT_BURST:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - server
    volumes:
      - backend_data:/app/data
      - backend_storage:/data/storage
    # Lets LLM_BASE_URL reach a model server on the host, for example Ollama:
    # LLM_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1500m

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-production}
        # Build-time only: these describe the image itself.
        - NEXT_PUBLIC_RELEASE_SHA=${NEXT_PUBLIC_RELEASE_SHA:-dev}
        - NEXT_PUBLIC_VERSION=${NEXT_PUBLIC_VERSION:-dev}
        - NEXT_PUBLIC_BUILD_TIMESTAMP=${NEXT_PUBLIC_BUILD_TIMESTAMP:-unknown}
        - NEXT_PUBLIC_SENTRY_RELEASE=${NEXT_PUBLIC_SENTRY_RELEASE:-dev}
        # Build-time fallbacks for the runtime settings below. They are
        # inlined into the bundle and lose to any runtime value; leave them
        # empty so one image serves any origin
        # (docs/self-hosting/frontend-config.md).
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_PUBLIC_URL=${NEXT_PUBLIC_PUBLIC_URL:-}
        - NEXT_PUBLIC_SUPPORT_EMAIL=${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        - NEXT_PUBLIC_NETWORK=${NEXT_PUBLIC_NETWORK:-}
        - NEXT_PUBLIC_RPC_URL=${NEXT_PUBLIC_RPC_URL:-}
        # CI-only escape for the e2e compose stack (http://localhost).
        - NEXT_PUBLIC_ALLOW_INSECURE_URLS=${NEXT_PUBLIC_ALLOW_INSECURE_URLS:-}
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        - NEXT_PUBLIC_MAINTENANCE_MODE=${NEXT_PUBLIC_MAINTENANCE_MODE:-}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
        - NEXT_PUBLIC_SENTRY_ENVIRONMENT=${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-}
        - NEXT_PUBLIC_SENTRY_ENABLED=${NEXT_PUBLIC_SENTRY_ENABLED:-}
        - NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-}
        - NEXT_PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${NEXT_PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE:-}
        - NEXT_PUBLIC_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE=${NEXT_PUBLIC_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE:-}
        # Source-map upload targeting. SENTRY_AUTH_TOKEN rides as a BuildKit
        # secret (never an image layer); empty org or token skips the upload.
        - SENTRY_ORG=${SENTRY_ORG:-}
        - SENTRY_FRONTEND_PROJECT=${SENTRY_FRONTEND_PROJECT:-}
        - SITEMAP_SKIP_REMOTE=${SITEMAP_SKIP_REMOTE:-false}
      secrets:
        - sentry_auth_token
    # Runtime configuration, read on every request
    # (docs/self-hosting/frontend-config.md).
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      # Same-origin proxy: /api/v1/* and /media/* are forwarded here, and
      # server-side API reads and next/image media fetches use it. Keep it set.
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8080}
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://backend:8080/api/v1}
      # Empty = same origin (/api/v1 through the proxy above).
      - API_URL=${API_URL:-}
      - NETWORK=${NETWORK:-baseSepolia}
      - PUBLIC_RPC_URL=${PUBLIC_RPC_URL:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      - SECURITY_EMAIL=${SECURITY_EMAIL:-}
      - MEDIA_ORIGINS=${MEDIA_ORIGINS:-}
      # Same value the backend gets: the CSP img-src allows the logo's host.
      - LOGO_URL=${LOGO_URL:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - SEO_INDEXING=${SEO_INDEXING:-false}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - FRONTEND_SENTRY_DSN=${FRONTEND_SENTRY_DSN:-}
      - FRONTEND_SENTRY_ENVIRONMENT=${FRONTEND_SENTRY_ENVIRONMENT:-development}
      - POSTHOG_KEY=${POSTHOG_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - server
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m

  # One-shot seeder for the "Trattoria Bella Vista" showcase data used in
  # screenshots and the FirstRunWizard preview tiles.
  # Run with:
  #   docker compose --env-file .env --profile seed run --rm showcase-seed
  # Pass extra flags (e.g. --owner-email) after the service name; they get
  # appended to the entrypoint, not replaced (compose run overrides only
  # `command:`, never `entrypoint:`).
  showcase-seed:
    image: golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36
    profiles:
      - seed
    working_dir: /app
    volumes:
      - ./backend:/app
      - showcase_seed_gocache:/go
    environment:
      - DATABASE_URL=postgres://${DB_USER:-payverge}:${DB_PASSWORD:-payverge_password}@postgres:5432/${DB_NAME:-payverge}?sslmode=disable
      - GOCACHE=/go/build-cache
    entrypoint: ["go", "run", "./perf/seed/showcase"]
    command: []
    networks:
      - server
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  backend_data:
    driver: local
  backend_storage:
    driver: local
  postgres_data:
    driver: local
  showcase_seed_gocache:
    driver: local

networks:
  server:
    driver: bridge

secrets:
  # Sourced from SENTRY_AUTH_TOKEN in the shell/.env; unset or empty simply
  # skips the source-map upload inside the frontend build.
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
