.art::before { content:""; position:absolute; inset:0 -40px -40px 0; background: radial-gradient(60% 60% at 60% 40%, var(--primary-soft), transparent 70%); z-index:-1; }
.rule { position:absolute; left:0; right:0; bottom:0; height:10px; background:var(--primary); }
.ill { width: 100%; height: auto; overflow: visible; font-family: var(--font-sans); }
.ill .card { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
.ill .soft { fill: var(--surface-2); }
.ill .line { stroke: var(--border); stroke-width: 1; }

.ill .ps { fill: var(--primary-soft); }
.ill .op { fill: var(--on-primary); }
.ill .a { fill: var(--accent); }
.ill .as { fill: var(--accent-soft); }
.ill .ring { fill: none; stroke: var(--primary); stroke-width: 1.25; }
.ill .hollow { fill: none; stroke: var(--muted); stroke-width: 1.25; }
.ill .b { font-weight: 600; }
.ill .f10 { font-size: 10px; }
.ill .f11 { font-size: 11px; }
.ill .f12 { font-size: 12px; }
.ill .f13 { font-size: 13px; }

.ill { overflow: visible; }
