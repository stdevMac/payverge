<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; color: #1c1917; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      #shots { max-height: 240px; overflow: auto; border: 1px solid #e7e5e4; border-radius: 8px; padding: 8px; }
      label { display: block; padding: 2px 0; }
      button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #1a6b6a; color: #fff; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      #log { margin-top: 10px; font-size: 12px; white-space: pre-wrap; color: #57534e; }
    </style>
  </head>
  <body>
    <h1>Payverge Screenshots</h1>
    <div id="shots"></div>
    <button id="run">Run</button>
    <div id="log"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
